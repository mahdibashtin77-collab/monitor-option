
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دوربین خودرو | مانیتور آپشن</title>
<meta name="description" content="انواع دوربین دنده عقب، دوربین ثبت وقایع و دوربین ۳۶۰ درجه خودرو در مانیتور آپشن.">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#111;
  color:#fff;
  line-height:1.8;
}
header{
  text-align:center;
  padding:15px;
}
.banner{
  width:100%;
  max-width:1100px;
  display:block;
  margin:0 auto 15px;
  border-radius:10px;
}
nav{
  text-align:center;
  padding:12px;
  background:#1b1b1b;
}
nav a{
  color:#d6ad55;
  text-decoration:none;
  margin:0 9px;
  font-size:14px;
}
h1{
  text-align:center;
  color:#d6ad55;
  margin:25px 10px;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
}
.card{
  background:#1d1d1d;
  border:1px solid #b18a3b;
  border-radius:12px;
  padding:12px;
  text-align:center;
}
.card img{
  width:100%;
  border-radius:8px;
  cursor:pointer;
}
.card h2{
  color:#d6ad55;
  font-size:18px;
}
.card p{
  color:#ddd;
  font-size:14px;
}
.card button{
  background:#d6ad55;
  color:#111;
  border:0;
  border-radius:7px;
  padding:9px 18px;
  cursor:pointer;
  font-weight:bold;
}
.modal{
  display:none;
  position:fixed;
  z-index:9999;
  inset:0;
  background:rgba(0,0,0,.95);
  overflow:auto;
  padding:25px 12px;
}
.modal-content{
  max-width:850px;
  margin:35px auto;
  text-align:center;
}
.close{
  position:fixed;
  top:8px;
  left:18px;
  color:#fff;
  font-size:38px;
  cursor:pointer;
  z-index:10000;
}
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}
.gallery img{
  width:100%;
  border-radius:10px;
  border:1px solid #d6ad55;
  cursor:pointer;
}
.modal h2{
  color:#d6ad55;
}
.notice{
  color:#eee;
  background:#252525;
  padding:18px;
  border-radius:10px;
}
footer{
  text-align:center;
  padding:25px;
  color:#aaa;
}
</style>
</head>

<body>

<header>
  <img class="banner" src="banner-monitor-option.png" alt="مانیتور آپشن">
</header>

<nav>
  <a href="index.html">صفحه اصلی</a>
  <a href="car-monitors.html">مانیتور خودرو</a>
  <a href="install-monitor.html">نصب مانیتور</a>
  <a href="repair-monitor.html">تعمیرات</a>
  <a href="cameras.html">دوربین خودرو</a>
  <a href="portfolio.html">نمونه کارها</a>
  <a href="contact.html">تماس با ما</a>
</nav>

<main class="container">
  <h1>انواع دوربین خودرو</h1>

  <section class="cards">

    <article class="card">
      <img src="camera-reverse.webp"
           alt="دوربین دنده عقب"
           onclick="openGallery('reverse')">
      <h2>دوربین دنده‌عقب</h2>
      <p>نمایش تصاویر واقعی دوربین دنده‌عقب خودرو</p>
      <button onclick="openGallery('reverse')">مشاهده تصاویر</button>
    </article>

    <article class="card">
      <img src="camera-dashcam.webp"
           alt="دوربین ثبت وقایع"
           onclick="openGallery('dashcam')">
      <h2>دوربین ثبت وقایع</h2>
      <p>مشاهده نمونه تصاویر دوربین ثبت وقایع</p>
      <button onclick="openGallery('dashcam')">مشاهده تصاویر</button>
    </article>

    <article class="card">
      <img src="camera-360.webp"
           alt="دوربین ۳۶۰ درجه"
           onclick="openGallery('360')">
      <h2>دوربین ۳۶۰ درجه</h2>
      <p>دوربین ۳۶۰ درجه خودرو</p>
      <button onclick="openGallery('360')">مشاهده توضیحات</button>
    </article>

  </section>
</main>

<div class="modal" id="galleryModal" onclick="closeOutside(event)">
  <span class="close" onclick="closeGallery()">&times;</span>
  <div class="modal-content" id="modalContent"></div>
</div>

<footer>
  مانیتور آپشن | نصب و خدمات تجهیزات خودرو
</footer>

<script>
const galleries = {
  reverse: {
    title: "تصاویر دوربین دنده‌عقب",
    images: [
      {
        src: "assets/cameras/Dorbin_2_kare.jpg",
        alt: "دوربین دنده‌عقب"
      },
      {
        src: "assets/cameras/Dorbin_90_daraje.jpg",
        alt: "دوربین ۹۰ درجه"
      }
    ]
  },

  dashcam: {
    title: "تصاویر دوربین ثبت وقایع",
    images: [
      {
        src: "assets/dashcam/Sabt_vaghaye_70_mai.jpg",
        alt: "دوربین ثبت وقایع"
      },
      {
        src: "assets/dashcam/Sabt_vaghaye%202.jpg",
        alt: "دوربین ثبت وقایع"
      }
    ]
  }
};

function openGallery(type) {
  const modal = document.getElementById("galleryModal");
  const content = document.getElementById("modalContent");

  if (type === "360") {
    content.innerHTML = `
      <h2>دوربین ۳۶۰ درجه</h2>
      <p class="notice">برای این بخش هنوز تصویر نمونه محصول اضافه نشده است.</p>
    `;
  } else {
    const data = galleries[type];

    content.innerHTML = `
      <h2>${data.title}</h2>
      <div class="gallery">
        ${data.images.map(item => `
          <img src="${item.src}" alt="${item.alt}" loading="lazy"
               onclick="showLargeImage('${item.src}','${item.alt}')">
        `).join("")}
      </div>
    `;
  }

  modal.style.display = "block";
  document.body.style.overflow = "hidden";
}

function showLargeImage(src, alt) {
  document.getElementById("modalContent").innerHTML = `
    <h2>${alt}</h2>
    <img src="${src}" alt="${alt}"
         style="width:100%;max-width:750px;border-radius:10px">
    <p><button onclick="openGallery('reverse')">بازگشت</button></p>
  `;
}

function closeGallery() {
  document.getElementById("galleryModal").style.display = "none";
  document.body.style.overflow = "auto";
}

function closeOutside(event) {
  if (event.target.id === "galleryModal") {
    closeGallery();
  }
}
</script>

</body>
</html>
